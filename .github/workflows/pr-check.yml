name: PR Check

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  static-analysis:
    name: Static Analysis & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Flutter project
        id: app
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "is_flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_flutter=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Flutter PR check: pubspec.yaml not found. This repository is treated as a template/non-app repo."
          fi

      - name: Read .fvmrc Flutter version
        if: steps.app.outputs.is_flutter == 'true'
        id: fvm
        run: |
          if [ -f ".fvmrc" ]; then
            VERSION=$(grep -o '"flutter": "[^"]*"' .fvmrc | sed 's/"flutter": "\(.*\)"/\1/')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=" >> $GITHUB_OUTPUT
          fi

      - name: Setup Flutter (with .fvmrc version)
        if: steps.app.outputs.is_flutter == 'true' && steps.fvm.outputs.version != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Setup Flutter (latest stable)
        if: steps.app.outputs.is_flutter == 'true' && steps.fvm.outputs.version == ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.app.outputs.is_flutter == 'true'
        run: flutter pub get

      - name: Verify formatting
        if: steps.app.outputs.is_flutter == 'true'
        run: dart format --set-exit-if-changed .

      - name: Analyze
        if: steps.app.outputs.is_flutter == 'true'
        run: flutter analyze

      - name: Test
        if: steps.app.outputs.is_flutter == 'true'
        run: |
          if [ -d "test" ] && [ "$(ls -A test 2>/dev/null)" ]; then
            flutter test
          else
            echo "No tests directory found, skipping."
          fi
