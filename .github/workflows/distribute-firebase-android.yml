name: Distribute Android Dev (Firebase App Distribution)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build & Distribute Android Dev
    # Repository Variables の ENABLE_FIREBASE_DEV_ANDROID=true をセットしないと走らない。
    # 新規アプリ初期状態では Firebase 未設定でも赤くならないようにするため。
    if: ${{ vars.ENABLE_FIREBASE_DEV_ANDROID == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .fvmrc Flutter version
        id: fvm
        run: |
          if [ -f ".fvmrc" ]; then
            VERSION=$(grep -o '"flutter": "[^"]*"' .fvmrc | sed 's/"flutter": "\(.*\)"/\1/')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=" >> $GITHUB_OUTPUT
          fi

      - name: Setup Flutter (with .fvmrc version)
        if: steps.fvm.outputs.version != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Setup Flutter (latest stable)
        if: steps.fvm.outputs.version == ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks
          ls -la $RUNNER_TEMP/release.jks

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          ANDROID_STORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload to Firebase App Distribution (dev)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_DEV_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_DEV_SERVICE_ACCOUNT_JSON }}
          # 通知対象は変数で指定（未設定なら通知なしで Firebase コンソールに残るのみ）
          # groups: ${{ vars.FIREBASE_TESTER_GROUPS }}
          # testers: ${{ vars.FIREBASE_TESTER_EMAILS }}
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
          file: build/app/outputs/flutter-apk/app-release.apk
