name: Publish Android Internal (Play Store)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-internal:
    name: Publish Android Internal Track
    if: ${{ vars.ENABLE_PLAY_INTERNAL_ANDROID == 'true' }}
    runs-on: ubuntu-latest
    environment: internal
    env:
      PLAY_METADATA_PATH: ${{ vars.PLAY_METADATA_PATH }}
      PLAY_PACKAGE_NAME: ${{ vars.PLAY_PACKAGE_NAME }}
      PLAY_INTERNAL_TRACK: ${{ vars.PLAY_INTERNAL_TRACK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .fvmrc Flutter version
        id: fvm
        run: |
          if [ -f ".fvmrc" ]; then
            VERSION=$(grep -o '"flutter": "[^"]*"' .fvmrc | sed 's/"flutter": "\(.*\)"/\1/')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter (with .fvmrc version)
        if: steps.fvm.outputs.version != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Setup Flutter (latest stable)
        if: steps.fvm.outputs.version == ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release AAB
        env:
          ANDROID_STORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Prepare Play Store metadata
        run: |
          METADATA_PATH="${PLAY_METADATA_PATH:-docs/play-store}"
          SCREENSHOT_DIR="$METADATA_PATH/ja-JP/images/phoneScreenshots"
          if ! compgen -G "$SCREENSHOT_DIR/*" > /dev/null && compgen -G "screenshots/*" > /dev/null; then
            mkdir -p "$SCREENSHOT_DIR"
            find screenshots -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -exec cp {} "$SCREENSHOT_DIR/" \;
          fi

      - name: Upload to Play Store internal track
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          METADATA_PATH="${PLAY_METADATA_PATH:-docs/play-store}"
          TRACK="${PLAY_INTERNAL_TRACK:-internal}"
          PACKAGE_NAME="${PLAY_PACKAGE_NAME:?PLAY_PACKAGE_NAME is required}"
          if [ "$TRACK" != "internal" ]; then
            echo "PLAY_INTERNAL_TRACK must be internal. Refusing to upload to: $TRACK"
            exit 1
          fi
          JSON_KEY="$RUNNER_TEMP/google-play-service-account.json"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$JSON_KEY"

          fastlane supply \
            --json_key "$JSON_KEY" \
            --package_name "$PACKAGE_NAME" \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --track "$TRACK" \
            --metadata_path "$METADATA_PATH"
